# Post a release result to Slack. Dispatched by the reusable release.yml.
#
# WHY THIS IS A SEPARATE, DISPATCHED WORKFLOW.
# release.yml is a REUSABLE workflow, and a called workflow can read neither
# store where the webhook could live:
#   - org SECRETS: invisible unless the caller passes them explicitly (the ~50
#     service repos pass only `token`). This is why release-maverick-crt.yml has
#     to declare aws-role-arn / spa-bucket / cloudfront-distribution-id as
#     passed secrets, with migrate.py:86-88 injecting the pass-through.
#   - org VARIABLES: `vars.X` reads the Variables tab only, so a value stored
#     under Organization secrets is simply not there (confirmed 2026-08-20).
#
# This workflow is NOT reusable — it is dispatched into legacy-workflows and
# runs in this repo's own context, so an org secret resolves normally. Net
# effect: the webhook stays a masked secret AND no service repo needs any
# change. The cost is one extra cheap run per release, which doubles as a
# central feed of every microservice release in this repo's Actions tab.
#
# Secrets (organization, Secrets tab):
#   SLACK_WEBHOOK_URL_DEV_RELEASES   -> #dev-releases
#   SLACK_WEBHOOK_URL_PROD_RELEASES  -> the prod channel
#
# Every input is a string on purpose: dispatching a `type: boolean` input
# through the REST API requires a real JSON boolean, and the caller builds this
# payload in shell. "true"/"false" as text is unambiguous.
name: Notify release to Slack

run-name: "${{ inputs.status == 'success' && '✅' || '❌' }} ${{ inputs.service }} ${{ inputs.version }} (${{ inputs.branch }})"

on:
  workflow_dispatch:
    inputs:
      service:
        description: "owner/repo of the released service"
        required: true
        type: string
      branch:
        description: "branch that was released; decides which channel"
        required: true
        type: string
      status:
        description: "success | failure | cancelled"
        required: true
        type: string
      version:
        description: "tag semantic-release cut, or the commit sha when it cut none"
        required: false
        default: ''
        type: string
      released:
        description: "'true' when a new version tag was actually cut"
        required: false
        default: 'false'
        type: string
      base:
        description: "Nearest reachable release tag + distance, e.g. 1.24.0-dev.1+2. Empty when a version was cut."
        required: false
        default: ''
        type: string
      artifact_id:
        required: false
        default: ''
        type: string
      is_microservice:
        required: false
        default: 'false'
        type: string
      actor:
        required: false
        default: ''
        type: string
      run_url:
        required: false
        default: ''
        type: string

concurrency:
  group: notify-release-${{ inputs.service }}-${{ inputs.branch }}
  cancel-in-progress: false

jobs:
  notify:
    name: Post to Slack
    runs-on: ubuntu-latest
    steps:
      - name: Post to Slack
        env:
          HOOK_DEV: ${{ secrets.SLACK_WEBHOOK_URL_DEV_RELEASES }}
          HOOK_PROD: ${{ secrets.SLACK_WEBHOOK_URL_PROD_RELEASES }}
          REPO_FULL: ${{ inputs.service }}
          BRANCH: ${{ inputs.branch }}
          STATUS: ${{ inputs.status }}
          VERSION: ${{ inputs.version }}
          RELEASED: ${{ inputs.released }}
          BASE: ${{ inputs.base }}
          ARTIFACT_ID: ${{ inputs.artifact_id }}
          IS_MICROSERVICE: ${{ inputs.is_microservice }}
          ACTOR: ${{ inputs.actor }}
          RUN_URL: ${{ inputs.run_url }}
          HEIMDALL_URL: http://heimdall-dev.pvt.create-store.com:8080
        run: |
          # Secrets ARE masked by GitHub, but guard anyway: masking "" emits
          # "Can't add secret mask for empty string", noise that reads like a fault.
          if [ -n "$HOOK_DEV" ];  then echo "::add-mask::$HOOK_DEV";  fi
          if [ -n "$HOOK_PROD" ]; then echo "::add-mask::$HOOK_PROD"; fi

          # Route by branch. master/main are the release branches, where
          # semantic-release cuts a real x.y.z; dev cuts x.y.z-dev.N
          # prereleases. Anything else is treated as non-prod.
          case "$BRANCH" in
            master|main) HOOK="$HOOK_PROD"; IS_PROD=true;  WHICH=PROD ;;
            *)           HOOK="$HOOK_DEV";  IS_PROD=false; WHICH=DEV  ;;
          esac
          export IS_PROD

          # Deliberately NO cross-channel fallback: posting a prod release into
          # the dev channel (or the reverse) invites someone to deploy the wrong
          # build. A missing webhook is loud and silent, not misdirected.
          if [ -z "$HOOK" ]; then
            echo "::warning::No $WHICH webhook available - nothing posted."
            echo "::warning::Set the org secret SLACK_WEBHOOK_URL_${WHICH}_RELEASES"
            echo "::warning::(Settings > Secrets and variables > Actions > Secrets)."
            exit 0
          fi

          # Built with json.dumps rather than interpolated into `curl -d`:
          # branch names and commit authors are free text, and a stray quote
          # would either break the JSON or inject into it.
          python3 - <<'PY' > /tmp/payload.json
          import json, os
          e = os.environ
          svc = e["REPO_FULL"].split("/")[-1]
          ver = e.get("VERSION") or ""
          status = e["STATUS"]
          released = e.get("RELEASED") == "true"
          is_ms = e.get("IS_MICROSERVICE") == "true"
          is_prod = e.get("IS_PROD") == "true"
          tag = "PROD " if is_prod else ""

          links = []
          if e.get("RUN_URL"):
              links.append(f"<{e['RUN_URL']}|Actions run>")
          # The Heimdall link is the create-dev console, so it is offered only for
          # dev builds. A prod release is deployed from the desktop app against a
          # different infrastructure, and linking a create-dev box next to a prod
          # version is how someone ends up deploying into the wrong environment.
          if is_ms and status == "success" and not is_prod:
              links.append(f"<{e['HEIMDALL_URL']}|Heimdall>")
          who = f" · by {e['ACTOR']}" if e.get("ACTOR") else ""
          art = f"*artifact* `main-{ver}`" + (f"  (id `{e['ARTIFACT_ID']}`)" if e.get("ARTIFACT_ID") else "")

          if status != "success":
              lines = [f"❌ *{svc}* — {tag}release *{status}* on `{e['BRANCH']}`{who}"]
          elif not is_ms:
              lines = [f"✅ *{svc}* — {tag}released `{ver}` on `{e['BRANCH']}`{who} (no artifact: not a microservice)"]
          elif released:
              head = (f"\U0001f680 *{svc}* — *PROD release* `{ver}` ready to deploy"
                      if is_prod else f"✅ *{svc}* — build ready to deploy")
              lines = [
                  head,
                  f"*version* `{ver}`   ← paste this into Heimdall",
                  art,
                  f"*branch* `{e['BRANCH']}`{who}",
              ]
          else:
              # No tag was cut, so `version` is a commit sha. It is deployable, but
              # it cannot be compared by eye against the semver that Heimdall's
              # status window shows -- "is 88050aa newer than 1.24.0-dev.1?" has no
              # answer at a glance. So state the relationship as an equation: which
              # tag this build descends from, and how far past it it is.
              #
              # Deliberately NOT presented as BEING that version. The build is ahead
              # of the tag, and naming a build after a tag it is not is exactly the
              # bug the Resolve version step exists to fix.
              base_tag, _, ahead = e.get("BASE", "").partition("+")
              lines = [f"\u26a0\ufe0f *{svc}* \u2014 {tag}build has *no new version* (no feat/fix commits)"]
              if base_tag and ahead.isdigit():
                  n = int(ahead)
                  lines.append(f"*this build* = `{base_tag}` + {n} commit{'' if n == 1 else 's'}")
              lines += [
                  f"*deploy it as* `{ver}`   \u2190 paste this into Heimdall (commit sha)",
                  art,
                  f"*branch* `{e['BRANCH']}`{who}",
              ]
          lines = [l for l in lines if l]
          if links:
              lines.append(" · ".join(links))
          print(json.dumps({"text": "\n".join(lines)}))
          PY
          curl -sS -m 15 -X POST -H 'Content-Type: application/json' \
            --data @/tmp/payload.json "$HOOK" \
            || echo "::warning::could not post to Slack"

# THROWAWAY PROBE — DELETE THIS FILE BEFORE MERGING TO main.
#
# Answers the one question the Slack notification design rests on: can a
# REUSABLE (called) workflow read an organisation-level VARIABLE?
#
# We know for certain it cannot read an org SECRET unless the caller passes it
# — release-maverick-crt.yml had to declare aws-role-arn / spa-bucket /
# cloudfront-distribution-id as passed secrets for exactly that reason, with
# migrate.py:86-88 injecting the pass-through. Whether `vars` is gated the same
# way is undocumented either way, so we measure instead of guessing.
#
# Never prints the value, only whether it arrived and how long it is.
#
# HOW TO RUN
#   1. push this branch to crt-platform/legacy-workflows
#   2. create the org variable SLACK_WEBHOOK_URL_DEV_RELEASES
#   3. in ONE low-traffic service repo, add .github/workflows/probe-vars.yml:
#
#        name: PROBE vars
#        on:
#          workflow_dispatch:
#        jobs:
#          probe:
#            uses: crt-platform/legacy-workflows/.github/workflows/probe-vars-TEMP.yml@feat/release-slack-notify
#
#      (workflow_dispatch only — it must not fire on pushes)
#   4. run it from that repo's Actions tab, read RESULT in the log
#   5. delete both files
name: PROBE - can a called workflow read org vars

on:
  workflow_call:

jobs:
  probe:
    name: Probe org variable visibility
    runs-on: ubuntu-latest
    steps:
      - name: Report visibility without leaking the value
        env:
          V: ${{ vars.SLACK_WEBHOOK_URL_DEV_RELEASES }}
        run: |
          echo "::add-mask::$V"
          echo "caller repository: ${{ github.repository }}"
          if [ -n "$V" ]; then
            echo "RESULT: VISIBLE (length ${#V}) -> option A works, no caller changes needed"
          else
            echo "RESULT: EMPTY -> a called workflow cannot read org variables."
            echo "        Fall back to passing the slack-webhook secret from each caller"
            echo "        (release.yml already accepts it; add it to migrate.py too)."
          fi

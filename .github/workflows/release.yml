name: Release node
on:
  workflow_call:
    secrets:
      token:
        required: true
    inputs:
      is-microservice:
        required: false
        default: false
        type: boolean
      ignored-path-prefix:
        description: 'Skip the main release when every changed file is inside this prefix.'
        required: false
        default: 'package_src'
        type: string
      notify:
        description: 'Post the release result to Slack.'
        required: false
        default: true
        type: boolean
      notifier-ref:
        description: 'Ref of notify-release.yml in legacy-workflows to dispatch. Override only to test an unmerged branch.'
        required: false
        default: 'main'
        type: string
      deploy:
        description: 'Hand the build to deploy-microservice.yml. Harmless when the service is not enrolled: that workflow exits 0 with NOT_ENROLLED unless ms-deploy carries <service>/deploy/<env>.yaml.'
        required: false
        default: true
        type: boolean
      deploy-branch:
        description: 'Only auto-deploy pushes to this branch. create-dev tracks dev; master/main have no unattended target yet.'
        required: false
        default: 'dev'
        type: string
      deploy-environment:
        description: 'Environment key in ms-deploy/deploy/environments.yaml.'
        required: false
        default: 'crt_dev'
        type: string

concurrency:
  group: release-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ secrets.token }}
  NPM_TOKEN: ${{ secrets.token }}
  NODE_AUTH_TOKEN: ${{ secrets.token }}
  IS_MICROSERVICE: ${{ inputs.is-microservice }}
jobs:
  detect-release-scope:
    name: Detect main release scope
    runs-on: ms
    outputs:
      should-release: ${{ steps.scope.outputs.should-release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect changed files for main release
        id: scope
        env:
          IGNORED_PATH_PREFIX: ${{ inputs.ignored-path-prefix }}
        run: |
          set -e

          if [ "${{ github.event_name }}" != "push" ] || [ -z "$IGNORED_PATH_PREFIX" ]; then
            echo "should-release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"

          # `git cat-file -e` guard: on a FORCE-PUSH the previous tip becomes
          # unreachable, so actions/checkout never fetches it, yet
          # github.event.before still names it -> `fatal: bad object <sha>` and
          # the whole release dies before it starts. The /ryan promotion
          # force-pushes dev by design, so without this every promotion burns a
          # run (seen on ecom.catalog 2026-07-31). Fall back to the head commit,
          # which is the same path already used for a first push.
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            CHANGED_FILES=$(git show --pretty="" --name-only "$AFTER")
          else
            CHANGED_FILES=$(git diff --name-only "$BEFORE" "$AFTER")
          fi

          echo "Changed files:"
          echo "$CHANGED_FILES"

          if [ -z "$CHANGED_FILES" ]; then
            echo "should-release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          SHOULD_RELEASE="false"
          while IFS= read -r changed_file; do
            [ -z "$changed_file" ] && continue

            case "$changed_file" in
              "${IGNORED_PATH_PREFIX%/}/"*)
                ;;
              *)
                SHOULD_RELEASE="true"
                break
                ;;
            esac
          done <<< "$CHANGED_FILES"

          echo "should-release=$SHOULD_RELEASE" >> "$GITHUB_OUTPUT"

  release:
    if: ${{ needs.detect-release-scope.outputs.should-release == 'true' && (github.event_name != 'push' || (!contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, 'Initial commit'))) }}
    needs: detect-release-scope
    name: Release
    runs-on: ms
    outputs:
      version: ${{ steps.version.outputs.version }}
      released: ${{ steps.version.outputs.released }}
      base: ${{ steps.version.outputs.base }}
      recycled: ${{ steps.version.outputs.recycled }}
      artifact-id: ${{ steps.upload-artifact.outputs.artifact-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set repository name
        run: echo REPO_NAME=$(echo ${{ github.repository }} | cut -d "/" -f 2) >> $GITHUB_ENV
      - name: Sync branch before releasing
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git pull --rebase origin ${{ github.ref_name }}
          git fetch origin +refs/notes/semantic-release:refs/notes/semantic-release || true
      - name: Prune orphaned prerelease tags
        id: prune
        run: |
          # Deleted tags are recorded to a FILE, not a shell variable: the `while`
          # body below is the right-hand side of a pipe and therefore runs in a
          # subshell, so anything assigned inside it would be lost on exit.
          : > /tmp/pruned-tags
          # A /ryan promotion force-pushes this branch, orphaning its previous
          # tip. Prerelease tags on the orphaned commits survive (tags are
          # separate refs), so semantic-release cannot see them as prior
          # releases yet recomputes the same version -> `fatal: tag
          # '1.371.0-dev.1' already exists` (maverick-logistic-bff 2026-08-03).
          # Delete THIS branch's prerelease tags that are unreachable from
          # HEAD, plus their GitHub Releases so the recreated tag can get a
          # fresh Release. Full release tags (x.y.z) never match the pattern,
          # and other branches' prerelease tags don't either — so a master/main
          # push can never delete live dev tags.
          git tag -l | grep -E "^[0-9]+\.[0-9]+\.[0-9]+-${{ github.ref_name }}\.[0-9]+$" | while read -r tag; do
            git merge-base --is-ancestor "${tag}^{commit}" HEAD 2>/dev/null && continue
            echo "Pruning orphaned prerelease tag: ${tag}"
            RELEASE_ID=$(curl -sf -H "Authorization: Bearer ${GH_TOKEN}" \
              "https://api.github.com/repos/${{ github.repository }}/releases/tags/${tag}" \
              | python3 -c "import json,sys; print(json.load(sys.stdin)['id'])" 2>/dev/null || true)
            if [ -n "$RELEASE_ID" ]; then
              echo "  deleting GitHub Release id ${RELEASE_ID}"
              curl -sf -X DELETE -H "Authorization: Bearer ${GH_TOKEN}" \
                "https://api.github.com/repos/${{ github.repository }}/releases/${RELEASE_ID}" \
                || echo "  WARN: could not delete GitHub Release ${RELEASE_ID}"
            fi
            git push origin ":refs/tags/${tag}"
            git tag -d "${tag}"
            echo "${tag}" >> /tmp/pruned-tags
          done
          PRUNED=$(paste -sd' ' /tmp/pruned-tags 2>/dev/null || true)
          echo "pruned=${PRUNED}" >> "$GITHUB_OUTPUT"
          if [ -n "$PRUNED" ]; then
            echo "pruned: ${PRUNED}"
          else
            echo "nothing to prune"
          fi
      # - name: Setup Node.js
      #   uses: actions/setup-node@v5
      #   with:
      #     node-version: '24.12.0'
      #     scope: "@ndcmsl"
      #     registry-url: "https://npm.pkg.github.com"
      #     cache: 'npm'
      # - name: Install npm v11.6.2 
      #   run: npm install -g npm@11.6.2
      - name: Install dependencies
        run: npm ci
      - name: Release
        run: npx semantic-release

      # Heimdall runs `git checkout <version>` on the target box
      # (deployment-execute-deploy.service.ts:233), so <version> MUST be a
      # valid git ref: the tag when semantic-release cut one, otherwise the
      # commit sha. NEVER tag+sha -- `1.63.0-dev.1-e887f34` resolves to
      # nothing and the deploy dies at checkout, after the artifact is
      # already on the box.
      #
      # The old logic was `git tag -l | sort -V | grep -i '^[1-9]' | tail -n 1`
      # -- the highest tag in the WHOLE repo, not the one just cut. On a push
      # that cuts no release it renamed the build after an ALREADY-USED
      # version, so one artifact name pointed at two different builds; Heimdall
      # then paired the newer dist/ with the older source tree and lock file.
      # Hit on ecom.notification 2026-07-14 and global.third-party 2026-07-16.
      # It also dropped any 0.x tag on the floor (`^[1-9]`), yielding `main-`.
      - name: Resolve version
        id: version
        env:
          PRUNED_TAGS: ${{ steps.prune.outputs.pruned }}
        run: |
          VERSION=$(git tag --points-at HEAD | grep -E '^[0-9]+\.[0-9]+\.[0-9]+' | sort -V | tail -1 || true)
          RECYCLED=false
          if [ -n "$VERSION" ]; then
            RELEASED=true
            BASE=""
            echo "semantic-release cut $VERSION"
            # A /ryan promotion force-pushes the branch, orphaning the previous
            # tip; the prune step above then deletes its prerelease tags so
            # semantic-release can run at all. But semantic-release only counts
            # tags REACHABLE from the branch, so with those gone it restarts the
            # counter -- 1.371.0-dev.2 can become 1.371.0-dev.1 again, pointing
            # at different code (maverick-logistic-bff, 2026-08-20). The number
            # is not monotonic across a promotion, and the old artifact of the
            # same name can still exist for 90 days. We cannot prevent that here,
            # so we detect it and say so.
            case " ${PRUNED_TAGS} " in
              *" ${VERSION} "*)
                RECYCLED=true
                echo "WARNING: ${VERSION} was just pruned and re-cut - the number is reused"
                ;;
            esac
          else
            VERSION=$(git rev-parse --short=7 HEAD)
            RELEASED=false
            # A sha is deployable but tells nobody WHERE they are: Heimdall's
            # status window shows semver (e.g. 1.24.0-dev.1), so a bare sha in
            # Slack cannot be compared against what is running. Report the
            # nearest reachable release tag and the distance from it, as
            # `1.24.0-dev.1+2`. Note this is NOT a version we could name the
            # artifact after: the build is 2 commits PAST that tag, and reusing
            # the tag's name is precisely the bug this step exists to fix.
            # The glob keeps `package-v*` tags out while matching x.y.z[-dev.N].
            TAG=$(git describe --tags --abbrev=0 --match '[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || true)
            if [ -n "$TAG" ]; then
              BASE="${TAG}+$(git rev-list --count "${TAG}..HEAD")"
            else
              BASE=""
            fi
            echo "no new release this run - labelling this build $VERSION (commit sha), based on ${BASE:-<no tags>}"
          fi
          {
            echo "version=$VERSION"
            echo "released=$RELEASED"
            echo "base=$BASE"
            echo "recycled=$RECYCLED"
          } >> "$GITHUB_OUTPUT"
      
      - name: Build proyect
        run: npm run build

      - name: Removing tsconfig.build file
        if: ${{ env.IS_MICROSERVICE == 'true' }}
        run: rm dist/tsconfig.build.tsbuildinfo

      - name: Compress build
        if: ${{ env.IS_MICROSERVICE == 'true' }}
        run: tar -czf dist.gz dist/*

      - name: Upload artifact main
        id: upload-artifact
        if: ${{ env.IS_MICROSERVICE == 'true' }}
        uses: actions/upload-artifact@v6
        with:
          name: main-${{ steps.version.outputs.version }}
          path: |
            dist.gz

      - name: Summarise the build
        if: ${{ env.IS_MICROSERVICE == 'true' }}
        run: |
          {
            echo "### Deployable build"
            echo ""
            if [ "${{ steps.version.outputs.released }}" = "true" ]; then
              echo "| | |"; echo "|---|---|"
              echo "| **version (paste into Heimdall)** | \`${{ steps.version.outputs.version }}\` |"
            else
              echo "> :warning: **No new version was cut this run** (no feat/fix commits)."
              echo "> This build is \`${{ steps.version.outputs.base }}\` — i.e. that tag plus"
              echo "> the commits after it — labelled with its commit sha, which Heimdall deploys."
              echo ""
              echo "| | |"; echo "|---|---|"
              echo "| **version (paste into Heimdall)** | \`${{ steps.version.outputs.version }}\` |"
            fi
            echo "| artifact | \`main-${{ steps.version.outputs.version }}\` |"
            echo "| artifact id | \`${{ steps.upload-artifact.outputs.artifact-id }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
      

  # Hands the result to notify-release.yml in legacy-workflows, which posts it.
  # It cannot be posted from here: this is a REUSABLE workflow, so it can read
  # neither an org secret (the ~50 callers pass only `token`) nor an org
  # variable (`vars.` reads the Variables tab; the webhook lives under
  # Secrets -- confirmed 2026-08-20). The notifier runs in legacy-workflows'
  # own context, where the org secret resolves normally: the webhook stays
  # masked and no service repo needs any change.
  #
  # Its own job (not a step in `release`) so a release that FAILS or never
  # starts still reports -- a step can only speak for a job that ran.
  notify:
    name: Notify Slack
    needs: [detect-release-scope, release, deploy]
    # Report on success and on failure, but stay quiet on a deliberate skip
    # (a package_src-only push, or [skip ci]) -- that is not news. A FAILED
    # detect-release-scope also skips `release`, and that IS news, hence the
    # two-part condition.
    #
    # ...and stay quiet when a deploy was dispatched: deploy-microservice.yml
    # posts the result itself, and "build ready to deploy" arriving seconds
    # before "deployed" is noise that reads like two separate events. If the
    # DISPATCH failed, this fires -- otherwise a build nothing will deploy would
    # pass in silence.
    if: >-
      ${{ always() && inputs.notify
          && (needs.detect-release-scope.result != 'success' || needs.release.result != 'skipped')
          && needs.deploy.result != 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch the Slack notification
        env:
          GH_TOKEN: ${{ secrets.token }}
          NOTIFIER_REF: ${{ inputs.notifier-ref }}
          REPO_FULL: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          STATUS: ${{ needs.detect-release-scope.result != 'success' && needs.detect-release-scope.result || needs.release.result }}
          VERSION: ${{ needs.release.outputs.version }}
          RELEASED: ${{ needs.release.outputs.released }}
          BASE: ${{ needs.release.outputs.base }}
          RECYCLED: ${{ needs.release.outputs.recycled }}
          ARTIFACT_ID: ${{ needs.release.outputs.artifact-id }}
          IS_MICROSERVICE: ${{ inputs.is-microservice }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # json.dumps, not string interpolation: branch names and commit authors
          # are free text and would otherwise break or inject into the payload.
          python3 - > /tmp/dispatch.json <<'PY'
          import json, os
          e = os.environ
          # Four named inputs (they show up in the notifier's run-name) plus one
          # JSON blob for the rest. GitHub caps workflow_dispatch at 10 inputs and
          # we hit that ceiling the moment `recycled` was needed -- the blob is
          # what keeps this extensible without another refactor.
          print(json.dumps({
              "ref": e["NOTIFIER_REF"],
              "inputs": {
                  "service": e["REPO_FULL"],
                  "branch":  e["BRANCH"],
                  "status":  e["STATUS"],
                  "version": e.get("VERSION") or "",
                  "extra": json.dumps({
                      "released":        e.get("RELEASED") or "false",
                      "base":            e.get("BASE") or "",
                      "recycled":        e.get("RECYCLED") or "false",
                      "artifact_id":     e.get("ARTIFACT_ID") or "",
                      "is_microservice": e.get("IS_MICROSERVICE") or "false",
                      "actor":           e.get("ACTOR") or "",
                      "run_url":         e.get("RUN_URL") or "",
                  }),
              },
          }))
          PY
          CODE=$(curl -s -o /tmp/resp.txt -w '%{http_code}' -m 20 -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/crt-platform/legacy-workflows/actions/workflows/notify-release.yml/dispatches" \
            --data @/tmp/dispatch.json) || CODE=000
          if [ "$CODE" = "204" ]; then
            echo "notification dispatched (HTTP 204) -> legacy-workflows / Notify release to Slack"
          else
            # Never fail a release over a notification. Diagnose instead.
            echo "::warning::could not dispatch the Slack notification (HTTP $CODE)"
            echo "::warning::$(head -c 300 /tmp/resp.txt | tr -d '\n')"
            echo "::warning::403/404 usually means GH_TOKEN lacks workflow (actions:write)"
            echo "::warning::scope on crt-platform/legacy-workflows, or notify-release.yml"
            echo "::warning::does not exist on ref '$NOTIFIER_REF'."
          fi

  # Hands the freshly built artifact to deploy-microservice.yml in
  # legacy-workflows, which SSHes into the create-dev boxes. Dispatched rather
  # than called for the same reason as `notify`: the deploy key is an org secret
  # that a reusable workflow cannot read.
  #
  # Rollout is gated by DATA, never by this file. deploy-microservice.yml exits
  # 0 with NOT_ENROLLED unless ms-deploy carries <service>/deploy/<env>.yaml, so
  # enabling this for every caller deploys only the services that opted in.
  #
  # Its own job, after `release` succeeded: there is no artifact otherwise. A
  # failed dispatch turns THIS job red while the release stays green — silence
  # here is exactly how a build sits undeployed and nobody notices.
  deploy:
    name: Deploy to create-dev
    needs: [release]
    if: >-
      ${{ inputs.deploy
          && inputs.is-microservice
          && needs.release.result == 'success'
          && github.ref_name == inputs.deploy-branch }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch the deploy
        env:
          GH_TOKEN: ${{ secrets.token }}
          SERVICE: ${{ github.event.repository.name }}
          VERSION: ${{ needs.release.outputs.version }}
          ENVIRONMENT: ${{ inputs.deploy-environment }}
        run: |
          set -euo pipefail
          if [ -z "${VERSION}" ]; then
            echo "::error::release produced no version to deploy"; exit 1
          fi
          # `version` is a tag OR a 7-char sha when no new version was cut;
          # deploy-microservice.yml resolves artifact main-<version> either way.
          cat > /tmp/deploy.json <<JSON
          {"ref":"main","inputs":{
            "service":"${SERVICE}","version":"${VERSION}","mode":"deploy",
            "environment":"${ENVIRONMENT}","ms_deploy_ref":"main"}}
          JSON
          CODE=$(curl -s -o /tmp/resp.txt -w '%{http_code}' -m 20 -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/crt-platform/legacy-workflows/actions/workflows/deploy-microservice.yml/dispatches" \
            --data @/tmp/deploy.json) || CODE=000
          if [ "$CODE" = "204" ]; then
            echo "deploy dispatched: ${SERVICE} ${VERSION} -> ${ENVIRONMENT}"
            {
              echo "### Deploy dispatched"
              echo ""
              echo "\`${SERVICE}\` **${VERSION}** -> \`${ENVIRONMENT}\`"
              echo ""
              echo "[Deploy microservice runs](https://github.com/crt-platform/legacy-workflows/actions/workflows/deploy-microservice.yml) — a service with no \`deploy/${ENVIRONMENT}.yaml\` in ms-deploy exits as NOT_ENROLLED."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::could not dispatch the deploy (HTTP $CODE) — the artifact is built but NOTHING will deploy it."
            echo "::error::$(head -c 300 /tmp/resp.txt | tr -d '\n')"
            echo "::error::403/404 usually means GH_TOKEN lacks workflow (actions:write) on crt-platform/legacy-workflows."
            exit 1
          fi

# Deploy a microservice to create-dev without Heimdall.
#
# MANUAL ONLY for now (workflow_dispatch). The automatic dispatch from
# release.yml is deliberately NOT wired yet: the first live reloads happen while
# someone is watching. Design: crt-agents/ci-cd/heimdall-deprecation.md
#
# Hosted and dispatched HERE rather than being reusable, for the same reason as
# notify-release.yml: a called workflow cannot read an org secret, and the ~50
# service repos pass only `token`. Dispatched, it runs in this repo's context,
# so SSH_DEPLOY_KEY_CRT_DEV resolves and no service repo needs any change.
#
# Rollout is gated by DATA, not by this file: if
# <service>/deploy/<env>.yaml is absent in ms-deploy, the job skips and the
# service stays on Heimdall.
name: Deploy microservice

run-name: "${{ inputs.mode }} ${{ inputs.service }} ${{ inputs.version }} -> ${{ inputs.environment }}"

on:
  workflow_dispatch:
    inputs:
      service:
        description: "Service name, e.g. global.content"
        required: true
        type: string
      version:
        description: "Tag (1.2.3-dev.4) or the 7-char commit sha of a build with no new version"
        required: true
        type: string
      mode:
        description: "plan = verify only · stage = everything except pm2 reload · deploy = for real"
        required: true
        default: plan
        type: choice
        options: [plan, stage, deploy]
      environment:
        description: "Environment key in ms-deploy/deploy/environments.yaml"
        required: false
        default: crt_dev
        type: string
      hosts:
        description: "Comma list overriding the service YAML, e.g. ms01"
        required: false
        default: ''
        type: string
      ms_deploy_ref:
        description: "ms-deploy ref to read config from (main is what ships)"
        required: false
        default: main
        type: string
      force_npm_ci:
        required: false
        default: false
        type: boolean
      clear_cache:
        required: false
        default: false
        type: boolean

concurrency:
  # Never two deploys of the same service at once: they would race one
  # node_modules and interleave pm2 reloads.
  group: deploy-${{ inputs.service }}-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: "${{ inputs.mode }} ${{ inputs.service }}"
    runs-on: ms
    steps:
      - name: Checkout legacy-workflows
        uses: actions/checkout@v4

      - name: Checkout ms-deploy config
        uses: actions/checkout@v4
        with:
          repository: crt-platform/ms-deploy
          ref: ${{ inputs.ms_deploy_ref }}
          token: ${{ secrets.GH_TOKEN }}
          path: .ms-deploy

      - name: Download the build artifact
        if: ${{ inputs.mode != 'plan' }}
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          SERVICE: ${{ inputs.service }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          NAME="main-${VERSION}"
          API="https://api.github.com/repos/crt-platform/${SERVICE}/actions/artifacts"

          # curl + python3 only: the self-hosted `ms` runner has neither `gh`
          # nor `unzip` (GitHub-hosted images do, which is what this originally
          # assumed). python3 is present and its stdlib covers both jobs.
          curl -sSf -H "Authorization: Bearer ${GH_TOKEN}" \
               -H "Accept: application/vnd.github+json" \
               "${API}?name=${NAME}&per_page=100" -o artifacts.json

          # A /ryan force-push can prune and re-cut the same x.y.z-dev.N over
          # DIFFERENT code, so two artifacts can share this name for up to 90
          # days. API order is not guaranteed: take the newest non-expired one.
          ID=$(python3 - <<'PY'
          import json
          live = [a for a in json.load(open('artifacts.json')).get('artifacts', []) if not a['expired']]
          live.sort(key=lambda a: a['created_at'])
          if len(live) > 1:
              print(f"::warning::{len(live)} live artifacts share this name — the version number was reused. "
                    "Deploying the newest; check the id below is the build you meant.")
              for a in live:
                  print(f"  id={a['id']} created={a['created_at']}")
          print(f"ARTIFACT_ID={live[-1]['id']}" if live else "ARTIFACT_ID=")
          PY
          )
          echo "$ID" | grep -v '^ARTIFACT_ID=' || true          # surface warnings
          ID=$(echo "$ID" | sed -n 's/^ARTIFACT_ID=//p')
          if [ -z "$ID" ]; then
            echo "::error::no live artifact named ${NAME} on crt-platform/${SERVICE}."
            echo "::error::Artifacts expire after 90 days; a build with no feat/fix commits is named main-<7-char sha>."
            exit 1
          fi
          echo "artifact id: $ID"

          # The API answers 302 to a presigned URL. Fetch the redirect target
          # first and download it unauthenticated: S3 rejects a request that
          # carries both its presigned query and an Authorization header.
          LOC=$(curl -sS -o /dev/null -w '%{redirect_url}' \
                  -H "Authorization: Bearer ${GH_TOKEN}" \
                  -H "Accept: application/vnd.github+json" \
                  "${API}/${ID}/zip")
          [ -n "$LOC" ] || { echo "::error::no download URL for artifact ${ID}"; exit 1; }
          curl -sSf -o artifact.zip "$LOC"

          python3 -c "import zipfile; zipfile.ZipFile('artifact.zip').extractall()"
          test -f dist.gz || { echo "::error::artifact did not contain dist.gz"; exit 1; }
          echo "ARTIFACT_PATH=$PWD/dist.gz" >> "$GITHUB_ENV"
          echo "ARTIFACT_ID=$ID" >> "$GITHUB_ENV"        # reported in the Slack message

      - name: Install the deploy key
        env:
          DEPLOY_KEY: ${{ secrets.SSH_DEPLOY_KEY_CRT_DEV }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_KEY}" ]; then
            echo "::error::SSH_DEPLOY_KEY_CRT_DEV is empty. An org secret must grant access to THIS repo."
            exit 1
          fi
          install -d -m 700 "$RUNNER_TEMP/.ssh"
          # printf guarantees the trailing newline OpenSSH requires; a pasted
          # secret missing it fails with a misleading 'error in libcrypto'.
          printf '%s\n' "${DEPLOY_KEY}" > "$RUNNER_TEMP/.ssh/deploy_key"
          chmod 600 "$RUNNER_TEMP/.ssh/deploy_key"
          echo "SSH_KEY_PATH=$RUNNER_TEMP/.ssh/deploy_key" >> "$GITHUB_ENV"

      - name: Run
        env:
          SSH_KEY_PATH: ${{ env.SSH_KEY_PATH }}
        run: |
          python3 microservice-deploy/deploy.py \
            --service   "${{ inputs.service }}" \
            --version   "${{ inputs.version }}" \
            --environment "${{ inputs.environment }}" \
            --mode      "${{ inputs.mode }}" \
            --hosts     "${{ inputs.hosts }}" \
            --ms-deploy .ms-deploy \
            --artifact  "${ARTIFACT_PATH:-}" \
            ${{ inputs.force_npm_ci && '--force-npm-ci' || '' }} \
            ${{ inputs.clear_cache && '--clear-cache' || '' }}

      - name: Remove the deploy key
        if: always()
        run: rm -f "$RUNNER_TEMP/.ssh/deploy_key"

      # Posted from here rather than via notify-release.yml: this workflow is
      # DISPATCHED into legacy-workflows, so it can read the org webhook secret
      # directly. One less hop, one less run in the Actions list, and no silent
      # dispatch failure between a finished deploy and the message about it.
      #
      # Only `deploy` mode is announced: plan and stage change nothing a channel
      # needs to hear about.
      - name: Notify Slack
        if: ${{ always() && inputs.mode == 'deploy' }}
        env:
          HOOK: ${{ secrets.SLACK_WEBHOOK_URL_DEV_RELEASES }}
          STATUS: ${{ job.status }}
          SERVICE: ${{ inputs.service }}
          VERSION: ${{ inputs.version }}
          ENVIRONMENT: ${{ inputs.environment }}
          HOSTS: ${{ inputs.hosts }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          if [ -z "${HOOK}" ]; then
            echo "::warning::no SLACK_WEBHOOK_URL_DEV_RELEASES — nothing posted"
            exit 0
          fi
          echo "::add-mask::$HOOK"
          # json.dumps, not interpolation: service and actor are free text.
          python3 - > /tmp/slack.json <<'PY'
          import json, os
          e = os.environ
          svc, ver = e["SERVICE"], e["VERSION"]
          env_name = e["ENVIRONMENT"]
          art = e.get("ARTIFACT_ID") or ""
          hosts = e.get("HOSTS") or "(from config)"
          who = f" · by {e['ACTOR']}" if e.get("ACTOR") else ""
          link = f"<{e['RUN_URL']}|Deploy run>"

          if e["STATUS"] == "success":
              lines = [
                  f"✅ *{svc}* — *deployed* `{ver}` to `{env_name}`",
                  f"*artifact* `main-{ver}`" + (f"  (id `{art}`)" if art else ""),
                  f"*hosts* {hosts}{who}",
              ]
          else:
              # A deploy is sequential across hosts and rolls back only on a failed
              # health gate. Anything earlier leaves the fleet untouched, so say
              # "check the run" rather than guessing which half happened.
              lines = [
                  f"❌ *{svc}* — *DEPLOY FAILED* for `{ver}` on `{env_name}` ({e['STATUS']}){who}",
                  f"*artifact* `main-{ver}`" + (f"  (id `{art}`)" if art else ""),
                  "The run log names the host it stopped on and whether it rolled back.",
              ]
          lines.append(link)
          print(json.dumps({"text": "\n".join(lines)}))
          PY
          curl -sS -m 15 -X POST -H 'Content-Type: application/json' \
            --data @/tmp/slack.json "$HOOK" >/dev/null \
            || echo "::warning::could not post the deploy result to Slack"
